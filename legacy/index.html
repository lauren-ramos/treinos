<script>

    search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',

  };
  function ic(n,st){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"'+(st?' style="'+st+'"':'')+'>'+(IC[n]||"")+'</svg>'}
  var GR={Pernas:{i:"footprints",c:"#7c5cff"},"Glúteos":{i:"heart",c:"#ff5c93"},Costas:{i:"chevs",c:"#0ea5a4"},Peito:{i:"shield",c:"#e8590c"},Ombros:{i:"triangle",c:"#2f80ed"},"Braços":{i:"dumbbell",c:"#d6336c"},Core:{i:"target",c:"#f59f00"},"Cárdio":{i:"pulse",c:"#e03131"}};

  function pad(n){return (n<10?"0":"")+n}
  function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function parseKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
  function sunday(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay())}
  function addDays(k,n){var d=parseKey(k);return dkey(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))}
  function wLabel(k){var a=parseKey(k),b=parseKey(addDays(k,6));return a.getDate()+" "+MESES[a.getMonth()]+" – "+b.getDate()+" "+MESES[b.getMonth()]}
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  try{
    var raw=localStorage.getItem(KEY)||localStorage.getItem("treinos.v1")||"{}",sv=JSON.parse(raw);
    if(sv.mode)S.mode=sv.mode;if(sv.treino)S.treino=sv.treino;if(sv.weeks)S.weeks=sv.weeks;if(sv.custom)S.custom=sv.custom;if(sv.plano)S.plano=sv.plano;if(sv.tour)S.tour=true;if(sv.theme&&sv.theme.accent)S.theme=sv.theme;
    if(sv.done&&!S.weeks[NOW])S.weeks[NOW]={done:sv.done};
  }catch(e){}
  /* tema (cor de destaque + claro/escuro), igual ao Plano CIAAR */

  function isHex(v){return /^#[0-9a-fA-F]{6}$/.test(v||"")}
  function hexToHsl(hex){var n=parseInt(hex.slice(1),16),r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;if(d===0)return [0,0,l*100];var s=d/(1-Math.abs(2*l-1)),h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;return [h,s*100,l*100]}
  function hsl(h,s,l){return "hsl("+Math.round(h)+" "+Math.round(s)+"% "+(Math.round(l*10)/10)+"%)"}
  function onColor(hex){var n=parseInt(hex.slice(1),16);function lin(c){var v=c/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)}var L=0.2126*lin((n>>16)&255)+0.7152*lin((n>>8)&255)+0.0722*lin(n&255);return L>0.45?"#1a1a1a":"#ffffff"}
  function paletteFor(t){
    var accent=isHex(t.accent)?t.accent:"#e0529c",x=hexToHsl(accent),h=x[0],s=x[1],l=x[2],sat=Math.max(s,12),dark=t.mode==="dark",pink=!dark&&accent.toLowerCase()==="#e0529c";
    if(pink)return {"--bg":"#ffffff","--surface":"#ffffff","--fg":"#2b0b1c","--card":"#fdf5f9","--muted":"#8f6f80","--blush":"#f8e8f0","--blush2":"#f3d9e6","--border":"#eddbe5","--sidebar":"#fcf6f9","--accent":accent,"--accent-ink":"#b8307a","--dark":"#2b0b1c","--on-accent":onColor(accent),"--label":"#a98096","--label-dim":"#c79bb3","--ink1":"#4a2a3b","--ink2":"#6f4a5e","--scheme":"light"};
    if(!dark)return {"--bg":"#ffffff","--surface":"#ffffff","--fg":hsl(h,Math.min(sat,55),11),"--card":hsl(h,Math.min(sat,60),97.5),"--muted":hsl(h,14,46),"--blush":hsl(h,Math.min(sat,55),94),"--blush2":hsl(h,Math.min(sat,50),89),"--border":hsl(h,Math.min(sat,40),89.5),"--sidebar":hsl(h,Math.min(sat,50),97.5),"--accent":accent,"--accent-ink":hsl(h,sat,Math.max(l*0.78,10)),"--dark":hsl(h,Math.min(sat,55),11),"--on-accent":onColor(accent),"--label":hsl(h,24,56),"--label-dim":hsl(h,26,70),"--ink1":hsl(h,25,24),"--ink2":hsl(h,24,33),"--scheme":"light"};
    return {"--bg":hsl(h,Math.min(sat,22),8),"--surface":hsl(h,Math.min(sat,20),12.5),"--fg":hsl(h,Math.min(sat,30),93),"--card":hsl(h,Math.min(sat,20),14.5),"--muted":hsl(h,12,64),"--blush":hsl(h,Math.min(sat,26),19),"--blush2":hsl(h,Math.min(sat,26),25),"--border":hsl(h,Math.min(sat,18),25),"--sidebar":hsl(h,Math.min(sat,22),10.5),"--accent":accent,"--accent-ink":hsl(h,sat,Math.min(Math.max(l*1.18,62),78)),"--dark":hsl(h,Math.min(sat,40),22),"--on-accent":onColor(accent),"--label":hsl(h,16,64),"--label-dim":hsl(h,16,74),"--ink1":hsl(h,20,86),"--ink2":hsl(h,20,82),"--scheme":"dark"};
  }
  function applyTheme(t){var v=paletteFor(t),r=document.documentElement;Object.keys(v).forEach(function(k){r.style.setProperty(k,v[k])});r.style.colorScheme=v["--scheme"];r.dataset.theme=t.mode}
  applyTheme(S.theme);

  var T=window.TREINOS.concat(S.custom);
  function reT(){T=window.TREINOS.concat(S.custom);if(!T.some(function(t){return t.id===S.treino}))S.treino=T[0].id}
  reT();
  function save(){try{localStorage.setItem(KEY,JSON.stringify({mode:S.mode,treino:S.treino,weeks:S.weeks,custom:S.custom,plano:S.plano,tour:S.tour,theme:S.theme}))}catch(e){}}

  function findT(id){return T.filter(function(t){return t.id===id})[0]}
  function cur(){return findT(S.treino)}
  function key(t,i){return t.id+":"+i.id}
  function R(k){var w=S.weeks[k]||{};return {done:w.done||{},checkins:w.checkins||{},load:w.load||{},sets:w.sets||{}}}
  function Wk(k){var w=S.weeks[k]||(S.weeks[k]={});w.done=w.done||{};w.checkins=w.checkins||{};w.load=w.load||{};w.sets=w.sets||{};return w}
  function nCheck(k){return Object.keys(R(k).checkins).length}
  function nDone(k){return Object.keys(R(k).done).length}
  function goal(){return Object.keys(S.plano).length}
  function totalEx(){var n=0;T.forEach(function(t){t.secoes.forEach(function(s){n+=s.itens.length})});return n}
  function lib(id){return window.EXERCICIOS.filter(function(e){return e.id===id})[0]}
  function grp(g){return GR[g]||{i:"dumbbell",c:"#6a4cff"}}
  function itemGrp(i){var ids=window.LIGACAO[i.id]||[];var e=ids.length&&lib(ids[0]);return e?e.grupo:null}
  function streak(){var g=goal();if(!g)return 0;var n=0,k=NOW;for(var i=0;i<104;i++){if(nCheck(k)>=g)n++;else if(k!==NOW)break;k=addDays(k,-7)}return n}
  function total(){var n=0;Object.keys(S.weeks).forEach(function(k){n+=nCheck(k)});return n}

  /* séries: valores da última semana com dados */
  function nSetsDefault(e){var m=e&&e.series&&e.series.match(/^(\d+)/);return m?Math.min(+m[1],6):3}
  function repsHint(e){var m=e&&e.series&&e.series.match(/×\s*(\d+)/);return m?m[1]:"10"}
  function lastSets(k){
    var ks=Object.keys(S.weeks).filter(function(w){return w<S.week}).sort().reverse();
    for(var j=0;j<ks.length;j++){var w=S.weeks[ks[j]];
      var a=w.sets&&w.sets[k];if(a&&a.some(function(s){return s.kg||s.r}))return a;
      if(w.load&&w.load[k])return [{kg:w.load[k],r:""}];
    }
    return null;
  }

  var timers={};
  function beep(){try{var C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(c.currentTime+.5)}catch(e){}try{if(navigator.vibrate)navigator.vibrate([300,100,300])}catch(e){}}
  function tick(k){var tm=timers[k];tm.left--;var o=$("o-"+k);if(o)o.textContent=fmt(Math.max(tm.left,0));if(tm.left<=0){clearInterval(tm.h);tm.run=false;tm.left=0;beep();render()}}

  /* ---------- peças ---------- */
  function steps(l){return '<ol class="steps">'+l.map(function(p){return "<li>"+esc(p)+"</li>"}).join("")+"</ol>"}
  function tsHtml(t,i){
    if(t.video){var sep=t.video.indexOf("?")>-1?"&":"?";return '<a class="pill" target="_blank" rel="noopener" href="'+esc(t.video+sep+"t="+i.t+"s")+'">'+ic("play")+' Minuto '+fmt(i.t)+' do vídeo</a>'}
    return '<span class="pill">'+ic("clock")+' '+fmt(i.t)+' no vídeo</span>';
  }

  /* mapa de músculos */

  function body(list,g,dx){
    var s='<g transform="translate('+dx+',0)"><circle class="base" cx="50" cy="16" r="11"/><rect class="base" x="30" y="34" width="40" height="62" rx="12"/><rect class="base" x="18" y="36" width="10" height="56" rx="5"/><rect class="base" x="72" y="36" width="10" height="56" rx="5"/><rect class="base" x="32" y="96" width="15" height="94" rx="7"/><rect class="base" x="53" y="96" width="15" height="94" rx="7"/>';

      else if(p[1]==="e")s+='<ellipse class="'+cl+'" cx="'+p[2]+'" cy="'+p[3]+'" rx="'+p[4]+'" ry="'+p[5]+'"'+o+'/>';

  }
  function bodyMap(g){return '<svg viewBox="0 0 230 195" role="img" aria-label="Mapa dos músculos trabalhados: '+esc(g)+'">'+body(FRONT,g,0)+body(BACK,g,125)+'<text x="50" y="193" font-size="9" text-anchor="middle" fill="currentColor" opacity=".6">Frente</text><text x="175" y="193" font-size="9" text-anchor="middle" fill="currentColor" opacity=".6">Costas</text></svg>'}

  /* fotos início/fim (efeito GIF) ou desenho animado */
  var ANIM={
    jack:['<circle cx="60" cy="22" r="8"/><path d="M60 30V68M60 38L48 58M60 38L72 58M60 68L55 100M60 68L65 100"/>','<circle cx="60" cy="22" r="8"/><path d="M60 30V68M60 38L38 18M60 38L82 18M60 68L40 100M60 68L80 100"/>'],
    burpee:['<circle cx="60" cy="22" r="8"/><path d="M60 30V68M60 38L50 14M60 38L70 14M60 68L56 100M60 68L64 100"/>','<circle cx="26" cy="64" r="8"/><path d="M34 70L98 92M44 76L44 100"/><path d="M8 102H112" opacity=".3"/>']
  };

    h+='<div class="mapbox"><div style="color:var(--muted)">'+bodyMap(e.grupo)+'</div><div><b>Músculos em destaque</b><div class="lbl">'+esc(e.musculos)+'</div></div></div>';
    h+='<div class="facts"><div class="fact"><span>Equipamento</span><b>'+esc(e.equip)+'</b></div><div class="fact"><span>Séries × repetições</span><b>'+esc(e.series)+'</b></div></div>';
    h+='<div class="seg" role="group"><button data-a="gmode" data-m="list" aria-pressed="'+(GD.mode==="list")+'">'+ic("list")+' Lista</button><button data-a="gmode" data-m="guided" aria-pressed="'+(GD.mode==="guided")+'">'+ic("target")+' Guiado</button></div>';
    if(GD.mode==="list"){h+='<h3>Como fazer</h3>'+steps(e.passos)}
    else{
      h+='<div class="guided"><div class="big">'+(GD.step+1)+'</div><small class="muted">Passo '+(GD.step+1)+' de '+n+'</small><p>'+esc(e.passos[GD.step])+'</p></div>';
      h+='<div class="dots">'+e.passos.map(function(_,i){return '<button data-a="gstep" data-i="'+i+'" class="'+(i===GD.step?'on':'')+'" aria-label="Passo '+(i+1)+'"></button>'}).join("")+'</div>';
      h+='<div class="gnav"><button class="btn sec" data-a="gprev"'+(GD.step===0?' disabled':'')+'>'+ic("chevL")+' Anterior</button><button class="btn" data-a="gnext"'+(GD.step===n-1?' disabled':'')+'>Próximo '+ic("chevR")+'</button></div>';
    }
    if(e.erros&&e.erros.length)h+='<h3>Erros comuns — evita!</h3>'+e.erros.map(function(x){return '<div class="callout bad">'+ic("xCircle")+'<div>'+esc(x)+'</div></div>'}).join("");
    if(e.dica)h+='<div class="callout tip">'+ic("bulb")+'<div><b>Dica de ouro:</b> '+esc(e.dica)+'</div></div>';
    h+='<div class="callout ok">'+ic("info")+'<div class="small">Como ler: <b>'+esc(e.series)+'</b> = séries × repetições. Descansa cerca de 60–90 s entre séries. Guia geral de técnica — não vem dos vídeos.</div></div></div>';
    return h;
  }
  function openLib(id){GD={id:id,mode:"list",step:0};$("dlg").innerHTML=dlgHtml();var d=$("dlg");if(d.showModal){if(!d.open)d.showModal()}else d.setAttribute("open","");var n=d.querySelector(".dlg-in");if(n)n.scrollTop=0}
  function redrawDlg(){var sc=$("dlg").querySelector(".dlg-in"),y=sc?sc.scrollTop:0;$("dlg").innerHTML=dlgHtml();var n=$("dlg").querySelector(".dlg-in");if(n)n.scrollTop=y}

  /* ---------- séries ---------- */
  function ensureSets(k){var ids=null;T.forEach(function(t){t.secoes.forEach(function(s){s.itens.forEach(function(i){if(key(t,i)===k)ids=window.LIGACAO[i.id]})})});
    var e=ids&&lib(ids[0]),a=Wk(S.week).sets;if(!a[k])a[k]=[];var n=nSetsDefault(e);while(a[k].length<n)a[k].push({r:"",kg:"",ok:false});return a[k]}

  /* ---------- importar ---------- */
  function parseImport(txt){
    var lines=txt.split(/\r?\n/).filter(function(l){return /^\s*[*\-•]\s+/.test(l)});if(!lines.length)return null;
    return lines.map(function(l,idx){
      l=l.replace(/^\s*[*\-•]\s+/,"").replace(/\*\*/g,"");
      var tm=l.match(/\[(?:(\d+):)?(\d+):(\d{2})\]/),t=0;if(tm)t=(tm[1]?+tm[1]*3600:0)+(+tm[2])*60+(+tm[3]);
      var clean=l.replace(/\[[^\]]*\]\([^)]*\)/g,"").replace(/\(\s*[-–]?\s*\)/g,"").replace(/\s+/g," ").replace(/[\s.]+$/,"").trim();
      var c=clean.indexOf(":"),nome=c>-1?clean.slice(0,c).trim():clean,desc=c>-1?clean.slice(c+1).trim():"";
      var sec=/aquec/i.test(nome)?"Aquecimento":(/c[aá]rdio|alongam/i.test(nome)?"Cárdio e final":"Treino");
      return {sec:sec,item:{id:"i"+idx,nome:nome,t:t,dose:"",resumo:true,passos:[desc||nome],dicas:[],igual:true}};
    }).filter(function(x){return x.item.nome});
  }
  function doImport(){
    var msg=$("imp-msg");msg.className="";var items=parseImport($("imp-txt").value);
    if(!items||!items.length){msg.className="err";msg.textContent="Não encontrei linhas começadas por * ou -. Cola o resumo com um exercício por linha.";return}
    var order=[],map={};items.forEach(function(x){if(!map[x.sec]){map[x.sec]={id:"s"+order.length,nome:x.sec,resumo:"",itens:[]};order.push(x.sec)}map[x.sec].itens.push(x.item)});
    var rank={"Aquecimento":0,"Treino":1,"Cárdio e final":2};var secoes=order.map(function(n){return map[n]}).sort(function(a,b){return rank[a.nome]-rank[b.nome]});
    var id="imp-"+Date.now();secoes.forEach(function(s){s.itens.forEach(function(i){i.id=id+"-"+i.id})});
    S.custom.push({id:id,titulo:$("imp-nome").value.trim()||"Treino importado",projeto:"Importado",foco:"",duracao:items.length+" blocos",video:$("imp-link").value.trim(),material:{casa:"Conforme o vídeo.",academia:"Conforme o vídeo."},secoes:secoes,importado:true});
    reT();S.treino=id;save();render();window.scrollTo(0,0);
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-a]");if(!b||b.disabled)return;
    var a=b.dataset.a,card=b.closest(".ex"),k=card&&card.dataset.k;
    if(a==="nav"){S.view=b.dataset.v;render();window.scrollTo(0,0)}
    else if(a==="pause"){b.classList.toggle("paused")}
    else if(a==="tmode"){S.theme.mode=b.dataset.m;applyTheme(S.theme);save();render()}
    else if(a==="taccent"){S.theme.accent=b.dataset.c;applyTheme(S.theme);save();render()}
    else if(a==="wprev"||a==="wnext"){S.week=addDays(S.week,a==="wprev"?-7:7);render()}
    else if(a==="wopen"){S.week=b.dataset.k;S.view="semana";render();window.scrollTo(0,0)}
    else if(a==="wcopy"){if(confirm("Copiar o progresso de "+wLabel(b.dataset.k)+" para a semana atual? Substitui os exercícios já marcados nela.")){var cp={};Object.keys(R(b.dataset.k).done).forEach(function(x){cp[x]=true});Wk(NOW).done=cp;S.week=NOW;save();render();window.scrollTo(0,0)}}
    else if(a==="wnew"){var ks=Object.keys(S.weeks).concat([NOW,S.week]).sort();S.week=addDays(ks[ks.length-1],7);Wk(S.week);save();S.view="semana";render();window.scrollTo(0,0)}
    else if(a==="go"){S.treino=b.dataset.t;S.week=NOW;S.view="treinos";render();window.scrollTo(0,0)}
    else if(a==="sel"){S.treino=b.dataset.id;save();render()}
    else if(a==="mode"){S.mode=b.dataset.m;save();render()}
    else if(a==="tour"){S.tour=true;save();render()}
    else if(a==="checkin"){var wk=b.dataset.w||NOW,d=b.dataset.d,w=Wk(wk);if(w.checkins[d])delete w.checkins[d];else w.checkins[d]=S.plano[d]||"livre";save();render()}
    else if(a==="reset"){if(confirm("Limpar os exercícios marcados deste treino nesta semana?")){var t=cur(),dn=Wk(S.week).done;Object.keys(dn).forEach(function(x){if(x.indexOf(t.id+":")===0)delete dn[x]});save();render()}}
    else if(a==="imp"){doImport()}
    else if(a==="del"){if(confirm("Remover este treino importado?")){S.custom=S.custom.filter(function(c){return c.id!==b.dataset.id});Object.keys(S.plano).forEach(function(d){if(!findT(S.plano[d])||S.plano[d]===b.dataset.id)delete S.plano[d]});reT();save();render()}}
    else if(a==="filtro"){S.filtro=b.dataset.f;render()}
    else if(a==="lib"){openLib(b.dataset.id)}
    else if(a==="close"){$("dlg").close()}
    else if(a==="gmode"){GD.mode=b.dataset.m;GD.step=0;redrawDlg()}
    else if(a==="gnext"){var n=lib(GD.id).passos.length;if(GD.step<n-1)GD.step++;redrawDlg()}
    else if(a==="gprev"){if(GD.step>0)GD.step--;redrawDlg()}
    else if(a==="gstep"){GD.step=+b.dataset.i;redrawDlg()}
    else if(a==="setok"){var sa=ensureSets(b.dataset.k),si=+b.dataset.i;sa[si].ok=!sa[si].ok;save();render()}
    else if(a==="setadd"){var sb=ensureSets(b.dataset.k);sb.push({r:"",kg:"",ok:false});save();render()}
    else if(a==="setdel"){var sc=ensureSets(b.dataset.k);if(sc.length>1)sc.pop();save();render()}
    else if(a==="open"){S.open[k]=!S.open[k];card.classList.toggle("open");b.setAttribute("aria-expanded",!!S.open[k])}
    else if(a==="done"){var dn2=Wk(S.week).done;if(dn2[k])delete dn2[k];else dn2[k]=true;save();render()}
    else if(a==="tstart"){var tm=timers[k];if(tm.run){clearInterval(tm.h);tm.run=false;b.textContent="Iniciar"}else{if(tm.left<=0)tm.left=tm.total;tm.run=true;tm.h=setInterval(function(){tick(k)},1000);b.textContent="Pausar"}}
    else if(a==="treset"){var m=timers[k];clearInterval(m.h);m.run=false;m.left=m.total;render()}
  });
  $("dlg").addEventListener("click",function(e){if(e.target===$("dlg"))$("dlg").close()});
  document.addEventListener("change",function(e){var el=e.target;
    if(el.id==="tcolor"){S.theme.accent=el.value;applyTheme(S.theme);save();render()}
    else if(el.classList.contains("plan-sel")){if(el.value)S.plano[el.dataset.d]=el.value;else delete S.plano[el.dataset.d];save();render()}
    else if(el.classList.contains("set-in")){var sa=ensureSets(el.dataset.k);sa[+el.dataset.i][el.dataset.f]=el.value.trim();save()}});
  document.addEventListener("input",function(e){if(e.target.id==="busca"){S.busca=e.target.value;$("lista").innerHTML=listaEx()}});
  document.addEventListener("keydown",function(e){if($("dlg").open&&GD.mode==="guided"){if(e.key==="ArrowRight"){var n=lib(GD.id).passos.length;if(GD.step<n-1){GD.step++;redrawDlg()}}else if(e.key==="ArrowLeft"&&GD.step>0){GD.step--;redrawDlg()}}});

  document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG"){var f=t.closest(".frames,.tile,.thumb");if(f)f.classList.add("broken")}},true);
  render();
})();
</script>
